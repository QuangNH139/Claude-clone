name: 🚀 Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:   # Cho phép chạy thủ công từ GitHub UI

concurrency:
  group: firebase-deploy
  cancel-in-progress: true   # Hủy deploy cũ nếu có deploy mới hơn đang chờ

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Cần để xác thực với Google Cloud

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ────────────────────────────────
      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      # ── 4. Inject secrets vào functions/.env ──────────────────
      # File này sẽ được upload cùng code lên Cloud Functions
      # và đọc như process.env khi function chạy
      - name: Write functions/.env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > functions/.env

      # ── 5. Build React app ─────────────────────────────────────
      # VITE_ vars là public Firebase config – dùng vars (không phải secrets)
      - name: Build React app
        env:
          VITE_FIREBASE_API_KEY:            ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:        ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:         ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:     ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:             ${{ vars.VITE_FIREBASE_APP_ID }}
        run: npm run build

      # ── 6. Authenticate với Google Cloud ──────────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # ── 7. Deploy lên Firebase ─────────────────────────────────
      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --non-interactive --project ${{ vars.FIREBASE_PROJECT_ID }}
